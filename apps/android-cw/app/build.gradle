plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cwstation.androidcw'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.cwstation.androidcw'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk {
            // Real phones only. x86_64 is intentionally omitted to keep the APK small.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                // The reused bridge is C++17. Static libc++ keeps the APK self-contained
                // without adding a shared runtime dependency.
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
